<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2a"/>
      <stop offset="0.58" stop-color="#0c2f43"/>
      <stop offset="1" stop-color="#075b59"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50d7ff"/>
      <stop offset="1" stop-color="#1fca91"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8e6e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020b12" flood-opacity="0.32"/>
    </filter>
    <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#071a2a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#background)"/>
  <circle cx="1135" cy="100" r="260" fill="#50d7ff" opacity="0.08"/>
  <circle cx="105" cy="745" r="260" fill="#1fca91" opacity="0.09"/>
  <path d="M 0 670 C 280 590, 490 790, 790 690 S 1110 580, 1280 650 V 800 H 0 Z" fill="#ffffff" opacity="0.035"/>
  <text x="72" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="800" fill="#74e7ca" text-anchor="start" opacity="1">SMART SCROLL NAVIGATOR · V2.1</text>
  <text x="72" y="130" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="50.0" font-weight="850" fill="#f7fbff" text-anchor="start" opacity="1">すぐに使えて、選択も尊重</text>
  <text x="74" y="177" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="21.0" font-weight="600" fill="#b8d5df" text-anchor="start" opacity="1">新規インストール時に案内を表示。匿名統計は初期状態でオフ</text>
  
      <g>
        <rect x="72" y="230" width="680" height="490" rx="30" fill="#ffffff" opacity="1" stroke="none" stroke-width="0" filter="url(#shadow)"/>
        <image x="108" y="266" width="54" height="54" href="data:image/png;base64,"/>
        <text x="184" y="298" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="17.4" font-weight="840" fill="#18354b" text-anchor="start" opacity="1">クイックスタート</text>
        <text x="108" y="357" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="850" fill="#08293b" text-anchor="middle" opacity="1">1</text>
        <circle cx="108" cy="350" r="24" fill="#74e7ca"/>
        <text x="108" y="357" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="850" fill="#08293b" text-anchor="middle" opacity="1">1</text>
        <text x="150" y="358" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="18.6" font-weight="720" fill="#284252" text-anchor="start" opacity="1">ページ端のボタンで上部または下部へ移動</text>
        <circle cx="108" cy="422" r="24" fill="#8edcff"/>
        <text x="108" y="429" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="850" fill="#08293b" text-anchor="middle" opacity="1">2</text>
        <text x="150" y="430" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="18.3" font-weight="720" fill="#284252" text-anchor="start" opacity="1">ツールバーからドメインごとに高度な機能を有効化</text>
        <circle cx="108" cy="494" r="24" fill="#ffd98a"/>
        <text x="108" y="501" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="850" fill="#513900" text-anchor="middle" opacity="1">3</text>
        <text x="150" y="502" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="20.9" font-weight="720" fill="#284252" text-anchor="start" opacity="1">設定でボタン、進捗、読書ツールを調整</text>
        <rect x="108" y="554" width="608" height="102" rx="22" fill="#f2f8fb"/>
        <text x="136" y="589" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14.9" font-weight="780" fill="#24475b" text-anchor="start" opacity="1">新規インストール後に設定を一度だけ開きます</text>
        <text x="136" y="622" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="15.2" font-weight="620" fill="#718592" text-anchor="start" opacity="1">更新、再起動、再読み込みでは繰り返し表示しません。</text>
        
    <rect x="108" y="674" width="166" height="44" rx="22" fill="#319fe2"/>
    
    <text x="191" y="703" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="18.0" font-weight="750" fill="#ffffff" text-anchor="middle" opacity="1">了解</text>
  
        <text x="296" y="702" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="13.8" font-weight="650" fill="#718592" text-anchor="start" opacity="1">後で「拡張機能について」から再表示</text>
      </g>
      <g>
        <rect x="788" y="230" width="420" height="300" rx="30" fill="#ffffff" opacity="1" stroke="none" stroke-width="0" filter="url(#shadow)"/>
        <text x="824" y="278" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16.8" font-weight="830" fill="#18354b" text-anchor="start" opacity="1">プライバシーと統計</text>
        <text x="824" y="320" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="17.9" font-weight="750" fill="#284252" text-anchor="start" opacity="1">匿名の利用統計を送信</text>
        
    <rect x="1114" y="296" width="60" height="34" rx="17" fill="#8395a7" opacity="1"/>
    <circle cx="1132" cy="313" r="13" fill="#ffffff"/>
  
        
    <rect x="824" y="350" width="152" height="44" rx="22" fill="#e9eef2"/>
    
    <text x="900" y="379" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="750" fill="#526876" text-anchor="middle" opacity="1">初期状態はオフ</text>
  
        <text x="824" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11.0" font-weight="850" fill="#78909f" text-anchor="start" opacity="1">送信しない情報</text>
        <text x="824" y="454" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="15.4" font-weight="720" fill="#405767" text-anchor="start" opacity="1">URL、ドメイン、ページ内容、ブックマーク</text>
        <text x="824" y="486" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="13.9" font-weight="720" fill="#405767" text-anchor="start" opacity="1">永続的なユーザー ID</text>
      </g>
      <g>
        <rect x="788" y="560" width="420" height="160" rx="30" fill="#ffffff" opacity="1" stroke="none" stroke-width="0" filter="url(#shadow)"/>
        <text x="824" y="608" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="25.0" font-weight="830" fill="#18354b" text-anchor="start" opacity="1">更新履歴</text>
        
    <rect x="1070" y="582" width="102" height="44" rx="22" fill="#dff8ff"/>
    
    <text x="1121" y="611" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="750" fill="#0b4863" text-anchor="middle" opacity="1">v2.1.0</text>
  
        <circle cx="832" cy="650" r="6" fill="#1fca91"/>
        <text x="850" y="657" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="17.5" font-weight="720" fill="#405767" text-anchor="start" opacity="1">拡張機能内で新機能と改善を確認</text>
        <circle cx="832" cy="688" r="6" fill="#50bff3"/>
        <text x="850" y="695" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14.2" font-weight="720" fill="#405767" text-anchor="start" opacity="1">すべての更新履歴をオフラインで表示</text>
      </g>
    
</svg>