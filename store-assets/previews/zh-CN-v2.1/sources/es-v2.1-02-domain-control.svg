          <text x="52" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="14.9" font-weight="720" fill="#f7fbff" text-anchor="start" opacity="1">Los cambios se aplican al instante</text>
